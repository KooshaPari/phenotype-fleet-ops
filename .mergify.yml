# schema: https://docs.mergify.com/mergify-configuration-schema.json
---
# Mergify Configuration — Optimized for multi-language monorepos
# Docs: https://docs.mergify.com/
#
# NOTE: check-success contexts reference REAL GitHub Actions contexts
# emitted by .github/workflows/ci.yml. As of HEAD 7f00cb3 those contexts are:
#   - ci/lint
#   - ci/test
#   - Lint & Format (workflow: lint-format.yml)
#   - Python (workflow: ci.yml job name)
#   - SonarCloud Code Analysis (workflow: sonarcloud.yml; only succeeds
#     after the SonarCloud project is registered in the kooshapari org)
#   - Mergify Merge Queue (managed by mergify itself)
#   - Summary (managed by mergify itself)
#
# Fictional contexts ("ci", "lint", "typecheck", "test" from the prior config)
# were removed because no workflow emits them.

pull_request_rules:
  # Auto-merge when all CI checks pass and PR is approved
  - name: Auto-merge when approved + CI green
    conditions:
      - "#review-requested=0"
      - "#approved-reviews-by>=1"
      - check-success=ci/lint
      - check-success=ci/test
      - check-success=Lint & Format
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})

          Co-authored-by: {{ author }}
      post_merge:
        action: close

  # Auto-merge dependabot/Renovate PRs when CI passes
  - name: Auto-merge dependency updates
    conditions:
      - or:
          - author = dependabot[bot]
          - author = renovate[bot]
      - check-success=ci/lint
      - check-success=ci/test
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})

          Co-authored-by: {{ author }}
      post_merge:
        action: close

  # Auto-merge bot PRs (CI configs, formatting) when CI passes
  - name: Auto-merge bot housekeeping PRs
    conditions:
      - or:
          - author = trunk-io[bot]
          - author = mergify[bot]
          - author = github-actions[bot]
      - check-success=ci/lint
      - check-success=Lint & Format
      - -conflict
      - -closed
    actions:
      merge:
        method: squash

  # Add reviewers based on changed paths
  - name: Request review from team
    conditions:
      - -closed
      - -draft
    actions:
      request_reviews:
        teams:
          - phenotype/core
        github_accounts:
          - KooshaPari

  # Label PRs based on changed files
  - name: Label Python changes
    conditions:
      - files~=\.py$
    actions:
      label:
        add:
          - python

  - name: Label Rust changes
    conditions:
      - files~=\.rs$|Cargo\.
    actions:
      label:
        add:
          - rust

  - name: Label Go changes
    conditions:
      - files~=\.go$|go\.
    actions:
      label:
        add:
          - go

  - name: Label TypeScript changes
    conditions:
      - files~=\.ts$|\.tsx$|package\.json
    actions:
      label:
        add:
          - typescript

  # Close stale PRs after 30 days
  - name: Close stale PRs
    conditions:
      - -closed
      - -draft
      - updated_at >= 30d
      - "#review-requested=0"
    actions:
      comment:
        message: >
          This PR has been automatically closed after 30 days of inactivity.
          Feel free to reopen if still relevant.
      close: {}

  # Warn on large PRs
  - name: Warn on large PRs
    conditions:
      - -closed
      - -draft
      - "#files>20"
    actions:
      comment:
        message: >
          **Large PR Alert**: This PR touches {{ number }} files.
          Consider splitting into smaller PRs for easier review.

  # Add ready-to-merge label when all checks pass
  - name: Add ready-to-merge label
    conditions:
      - -closed
      - -draft
      - check-success=ci/lint
      - check-success=ci/test
      - check-success=Lint & Format
      - "#approved-reviews-by>=1"
    actions:
      label:
        add:
          - ready-to-merge
