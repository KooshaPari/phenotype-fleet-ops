# macos-fetch-secrets.yml
# Reusable workflow that pulls Apple Developer Program secrets from Infisical.
# Consumed by every Apple-signing/-notarizing job across the fleet.
#
# Required repo-level secret (the Infisical service token, machine identity):
#   INFISICAL_TOKEN
#
# Required repo-level variable:
#   INFISICAL_PROJECT_ID (defaults to fleet-ops project if unset)
#
# Required Infisical secrets (project /apple/<repo_name> or /apple for org default):
#   APPLE_TEAM_ID
#   APPLE_DEVELOPER_ID_P12_BASE64
#   APPLE_DEVELOPER_ID_P12_PASSWORD
#   APPLE_NOTARIZATION_ISSUER_ID
#   APPLE_NOTARIZATION_KEY_ID
#   APPLE_NOTARIZATION_KEY_P8_BASE64
#   APPLE_BUNDLE_ID (per-repo override)

name: macOS Fetch Apple Secrets

on:
  workflow_call:
    inputs:
      secret-path:
        description: "Infisical path (default: /apple/<repo_name>)"
        type: string
        required: false
        default: ""
      env:
        description: "Infisical env (dev|staging|prod). Auto-detected from branch if empty."
        type: string
        required: false
        default: ""
    secrets:
      INFISICAL_TOKEN:
        required: true
    outputs:
      apple_team_id:
        description: "Decoded APPLE_TEAM_ID"
        value: ${{ jobs.fetch.outputs.apple_team_id }}
      apple_signing_identity:
        description: "Decoded APPLE_SIGNING_IDENTITY (or computed default)"
        value: ${{ jobs.fetch.outputs.apple_signing_identity }}

jobs:
  fetch:
    name: Pull Apple secrets from Infisical
    runs-on: [self-hosted, linux, codesign]   # zero billed minutes
    timeout-minutes: 5
    outputs:
      apple_team_id: ${{ steps.run.outputs.apple_team_id }}
      apple_signing_identity: ${{ steps.run.outputs.apple_signing_identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          if ! command -v infisical >/dev/null 2>&1; then
            # Linux install — pin to 0.31.x for stable dotenv output
            curl -1sLf \
              "https://artifacts.infisical.com/cli/v0.31.1/infisical-cli-linux-amd64.deb" \
              -o /tmp/infisical.deb
            sudo apt-get install -y /tmp/infisical.deb
          fi
          infisical --version

      - name: Fetch Apple secrets from Infisical
        id: run
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ inputs.env || (github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev') }}
          INFISICAL_PATH: ${{ inputs.secret-path || format('/apple/{0}', github.event.repository.name) }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/reusable/macos-signing/fetch_apple_secrets.sh" \
            --project-id "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --path "$INFISICAL_PATH" \
            --env-file "$GITHUB_WORKSPACE/.apple-secrets.env"

          # Decode base64 secrets to disk so native tooling can read them
          mkdir -p "$GITHUB_WORKSPACE/.apple-keys"
          chmod 700 "$GITHUB_WORKSPACE/.apple-keys"

          # .env is dotenv-quoted; pull values via `source` rather than regex
          set -a
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/.apple-secrets.env"
          set +a

          if [[ -n "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ]]; then
            base64 -d <<<"$APPLE_DEVELOPER_ID_P12_BASE64" > "$GITHUB_WORKSPACE/.apple-keys/developer-id.p12"
            chmod 600 "$GITHUB_WORKSPACE/.apple-keys/developer-id.p12"
          fi
          if [[ -n "${APPLE_NOTARIZATION_KEY_P8_BASE64:-}" && -n "${APPLE_NOTARIZATION_KEY_ID:-}" ]]; then
            base64 -d <<<"$APPLE_NOTARIZATION_KEY_P8_BASE64" > "$GITHUB_WORKSPACE/.apple-keys/AuthKey_${APPLE_NOTARIZATION_KEY_ID}.p8"
            chmod 600 "$GITHUB_WORKSPACE/.apple-keys/AuthKey_${APPLE_NOTARIZATION_KEY_ID}.p8"
          fi

          # Compute signing identity if not provided: "Developer ID Application" is the
          # safe default; the cert SHA-1 lookup happens at sign-time.
          identity="${APPLE_SIGNING_IDENTITY:-Developer ID Application}"

          echo "apple_team_id=${APPLE_TEAM_ID}" >> "$GITHUB_OUTPUT"
          echo "apple_signing_identity=${identity}" >> "$GITHUB_OUTPUT"

          echo "✓ Apple secrets fetched (path=$INFISICAL_PATH env=$INFISICAL_ENV)"
          echo "  APPLE_TEAM_ID=$APPLE_TEAM_ID"
          echo "  APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-<unset, default at sign-time>}"
          echo "  APPLE_SIGNING_IDENTITY=$identity"

      - name: Upload Apple secrets as debug artifact (never published)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-secrets-debug
          path: |
            .apple-secrets.env
            .apple-keys/
          retention-days: 1
