name: validate-fleet

# validate-fleet.sh is an operator-local tool — it depends on the
# machine having all 11 sibling fleet repos cloned at the expected
# branches. The CI runner has only this repo, so the script's preflight
# (`REPOS_ROOT/$MASTER must be a directory`) will always fail there.
#
# Triggers: schedule (weekly) and manual workflow_dispatch. The push
# trigger that previously ran the script on every PR touching any of
# the propagated files was removed because it could never succeed in
# CI and only produced noisy red Xs on otherwise valid PRs.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose output"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fleet-ops
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python (for validate-fleet.sh if it ever needs it)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make validate-fleet.sh executable
        run: chmod +x tools/review-surface-boot/validate-fleet.sh

      - name: Run validate-fleet.sh
        id: run_validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/review-surface-boot/validate-fleet.sh ${{ inputs.verbose == true && '--verbose' || '' }}

      - name: Fail loudly on drift
        if: steps.run_validate.outcome != 'success'
        run: |
          echo "::error::validate-fleet.sh reported failures — fleet has drifted from fleet-ops master"
          echo "Run \`bash tools/review-surface-boot/validate-fleet.sh\` locally and re-propagate the listed files."
          exit 1

  # Aggregate status check: success only if validate passed AND no parse errors.
  # Used by branch protection as required status check.
  aggregate:
    needs: validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if validate job failed
        if: needs.validate.result != 'success'
        run: |
          echo "validate-fleet job status: ${{ needs.validate.result }}"
          exit 1
      - name: Mark OK
        if: needs.validate.result == 'success'
        run: echo "validate-fleet aggregate status check passed"
